[project]
name = "rag-intro"
version = "0.1.0"
description = "Minimal RAG project based on LLM Zoomcamp module 01-intro"
requires-python = ">=3.11"
dependencies = [
    "minsearch==0.0.11",
    "openai==1.109.1",
    "sqlitesearch==0.0.4",
    "elasticsearch==8.19.3",
    "requests==2.34.0",
    "python-dotenv==1.2.2",
    "jupyter==1.1.1",
    "sentence-transformers>=5.5.0",
    "psycopg[binary]>=3.3.4",
    "toyaikit>=0.0.10",
    "streamlit>=1.57.0",
    "psycopg2-binary>=2.9.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "hypothesis==6.152.6",
]
